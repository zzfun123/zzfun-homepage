<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zzfun.cc — 造点好玩的 · 网站正在施工 (Under Construction)</title>
  <meta name="description" content="zzfun.cc 网站正在施工升级中（Under Construction）——造点好玩的，正在打磨全新版本，敬请期待。">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><ellipse cx='16' cy='18.5' rx='12.5' ry='10.8' fill='%23FF4633'/><path d='M9.5 15.5c.8-2.6 2.8-4.2 5.2-4.6' stroke='%23FFE3DC' stroke-width='2.2' stroke-linecap='round' fill='none'/><path d='M16 4.5v5M16 9c-3.2-2.2-6.8-1-8.5 1.8 2.8-.4 5.5.2 8.5 1.2 3-1 5.7-1.6 8.5-1.2-1.7-2.8-5.3-4-8.5-1.8Z' fill='%2327AE60' stroke='%231E8449' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- WebGL 3D 画布：纯白画廊底 + 中央单颗可把玩 3D 西红柿 -->
  <canvas id="gl" aria-label="3D 西红柿，按住拖拽可旋转，点击可弹跳"></canvas>

  <!-- 自定义光标 -->
  <div class="cursor" id="cursor" aria-hidden="true"><i></i></div>

  <!-- 单屏画廊容器 -->
  <main class="gallery">
    <!-- 顶部眉头 -->
    <header class="topbar">
      <a class="logo" href="/" data-hover>
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="16" cy="18.5" rx="12" ry="10.2" fill="#FF4633" stroke="#14181F" stroke-width="2"/>
            <path d="M9.5 16.5C10.2 14 12 12.4 14.5 12" stroke="#FFF2EE" stroke-width="2.1" stroke-linecap="round"/>
            <path d="M16 4.2V8.8" stroke="#14181F" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M16 8.2C12.8 6.2 9 7.2 7.5 10.2C10.5 9.8 13.4 10.4 16 11.8C18.6 10.4 21.5 9.8 24.5 10.2C23 7.2 19.2 6.2 16 8.2Z" fill="#27AE60" stroke="#14181F" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </span>
        <b>zzfun</b><span class="logo-tld">.cc</span>
      </a>

      <div class="status-pill mono">
        <i class="status-dot"></i>
        <span>WIP · 正在施工</span>
      </div>
    </header>

    <!-- 中央视觉与排版区 -->
    <section class="centerpiece">
      <!-- 3D 西红柿拖拽热区 -->
      <div class="tomato-zone" id="dragZone" data-hover aria-hidden="true"></div>

      <!-- 核心文字区：网站正在施工 / UNDER CONSTRUCTION -->
      <div class="title-block">
        <h1 class="cn-title">网站正在施工</h1>
        <p class="en-title mono">UNDER CONSTRUCTION</p>
        <span class="divider" aria-hidden="true"></span>
        <p class="desc">
          正在打磨一些真正好玩的东西，敬请期待。<br>
          <span class="desc-en">Something fun is brewing. Please check back soon.</span>
        </p>
      </div>
    </section>

    <!-- 底部画廊注脚 -->
    <footer class="bottombar mono">
      <span>© 2026 ZZFUN.CC</span>
      <span class="hint-text">DRAG OR CLICK THE TOMATO · 拨动西红柿把玩</span>
    </footer>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
